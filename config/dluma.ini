[loader]
; Automatically enable new and updated global mods at startup.
; Disabled by default. The Options menu shows a security warning before enabling.
; Mods you manually disable remain disabled.
auto_enable_mods=0
poll_interval_ms=250
; Refresh interval for the DL Scripts Universal Screen page. The validated
; frame hook drives updates; this also controls the message-timer fallback.
universal_screen_poll_interval_ms=100
unmatched_level_grace_ms=1500
enable_key_events=1
log_timer_events=0
; Shares the current frontend menu or gameplay map, pause state, and quest
; with the Discord desktop client. Set to 0 to clear and disable presence.
discord_rich_presence_enabled=1
; Shares only the sanitized active document type and filename from the native
; Editor. Paths and project details are redacted. The stock Editor options
; Workbench Mods tab applies this setting immediately.
editor_discord_rich_presence_enabled=1
; Shares the same localized menu/gameplay context in Steam's View Game Info.
; This status fallback uses the player's game locale. Full per-viewer enhanced
; localization requires AppID configuration by the game's Steamworks partner.
steam_rich_presence_enabled=1
; Uses the selected custom map's Workshop or local project title, author,
; description, and ready preview on the next loading transition. Authored
; startprop values still override their corresponding generated fields.
custom_map_workshop_loading_screen=1
; Startup-only: on supported Player builds, enables cheats/developer keys,
; skips startup logos and the level-start wait, and exposes Lua limits after
; restarting. The loader-owned debugconf.scr remains available to launches
; that explicitly select it with -debugconf=debugconf.scr.
developer_mode=0

[AnimationRefresh]
; Exact-profile-gated handoff for project-owned ReAnimated animation refresh
; requests. Enabled by default. The loader intercepts the stock animation
; reload shortcut and performs a selected-model transaction on the owner UI
; thread; it never invokes the crash-prone global animation invalidation.
Enabled=1
; ProjectRPack is the normal Editor and Player route. RawLoose is an advanced
; Editor-only route that restores compiled mixer mode on every exit path.
Route=ProjectRPack
[AnalysisBridge]
; Local authenticated diagnostics only. Bootstrap prints this contributor's
; 16-character StateId. Keep disabled unless an explicitly approved live test
; is underway; mutating registry commands also require AllowActions=1.
Enabled=0
AllowActions=0
StateId=

[lua]
memory_limit_bytes=8388608
instruction_limit=200000
wall_clock_limit_ms=10
max_callbacks=64
max_timers=32
max_rules=16
log_messages_per_second=20

[lua_local_permissions]
; Project/map scripts must declare each permission in their metadata and the
; matching switch here must be on. Changes apply after restarting the loader.
game_read=1
player_read=1
world_query=1
events_sensor=1
events_interact=1
storage_mod=1
ui_debug=1
ui_overlay=1
audio_play=1
world_write=1
; These opt-ins do not enable an unvalidated native adapter. Quest-native
; control and enemy-killed observation remain unavailable until verified.
quest_write=0
events_enemy_killed=0
quest_phase_handle=0
quest_phase_observe=0

[crash_dialog]
; Crash reports are always mirrored to the loader log and dluma_runtime\crashes.
; This setting controls only the popup shown after Chrome's dump callback.
; Diagnostics do not catch or recover from exceptions, and the callback's
; original dump result is returned unchanged.
enabled=1
; Set to 1 to opt into randomized localized title quips from the game text locale.
random_titles=0

[GameFixes]
; Native built-in compatibility fix. Workshop Lua cannot change native fixes.
CustomMapQuestLevelNameCrash=1
; Preserves custom campaign credits and guards the validated DevTools
; post-credits null cleanup crash. Requires the project-exit tracker below.
CustomMapCampaignCreditsExitCrash=1
; Plays dl_menu_end_credits on the front-end CREDITS screen while the normal
; DW_Menu lifecycle is suspended. Does not affect campaign or in-game credits.
MainMenuCreditsMusic=1
; Experimental project-resource unload. It is not fully implemented yet and
; remains off by default. Set this to 1 only when intentionally opting in.
; Unresolved ownership remains fail-closed and keeps the aggregate partial.
CustomMapAssetIsolation=0
; Hides Workshop map-selector projects that do not contain data\maps.
HideInvalidWorkshopProjects=1
; Repairs project-local backgroundmoduletextures.def aliases and allows an
; authored loading description to render even without objective header text.
CustomMapLoadingScreenContent=1
; Keeps the pointer inside the game client area while Dying Light is active.
; Alt+Tab, focus loss, minimize, and shutdown release it immediately.
MouseWindowLock=1

[AssetIsolationTrace]
; Exact logical paths only. Matching normalizes ASCII case, slash direction,
; leading slashes, and duplicate separators; basename-only matches are never
; accepted. Up to eight bounded watched .scr paths may be configured.
WatchScr1=
WatchScr2=
WatchScr3=
WatchScr4=
WatchScr5=
WatchScr6=
WatchScr7=
WatchScr8=
; Exact full logical resource paths or full physical paths may be watched.
; The file must resolve through an exact Assets_PC source to enter the targeted
; ledger. Basename-only matching and inferred resource ownership are rejected.
WatchAsset1=
WatchAsset2=
WatchAsset3=
WatchAsset4=
WatchAsset5=
WatchAsset6=
WatchAsset7=
WatchAsset8=

[roots]
; Auto-discovery normally finds both locations below.
; Add explicit paths only if your Steam library layout is unusual.
; root1=<Dying Light DevTools workshop directory>
; root2=<Steam Workshop content\239140 directory>
